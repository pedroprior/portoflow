name: Testes da API

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portoflow
          POSTGRES_USER: portoflow
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portoflow"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://portoflow:ci-${{ github.run_id }}@localhost:5432/portoflow

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Segredos descartáveis gerados a cada execução
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SEED_SENHA_ADMIN=$(openssl rand -hex 12)" >> "$GITHUB_ENV"
          echo "SEED_SENHA_PADRAO=$(openssl rand -hex 12)" >> "$GITHUB_ENV"
      - name: Migrations e seed no PostgreSQL real
        run: |
          alembic upgrade head
          alembic check
          python seed.py
          alembic downgrade base
      - name: Testes
        run: pytest --cov=app --cov-report=term
